<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Guardar evidencia visual del prototipo</title><style>body{font:16px/1.5 system-ui;background:#10141e;color:white;max-width:720px;margin:40px auto;padding:20px}label{display:block;margin:20px 0}input,textarea,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;background:#182842;color:white;border:1px solid #6484aa;border-radius:8px}textarea{height:180px}button{cursor:pointer}a{color:#82cfff}</style><h1>Guardar captura de revisión</h1><p>Utilidad local para conservar los bytes JPEG de una captura del navegador. No procesa ni modifica imágenes.</p><label>Nombre del archivo<input id="filename" value="captura-abc.jpg"></label><label>Bytes de la captura, array JSON<textarea id="bytes"></textarea></label><button id="save" type="button">Guardar JPEG</button><p id="result" role="status"></p><a href="index.html">Volver al laboratorio</a><script>document.getElementById('save').addEventListener('click',()=>{try{const bytes=new Uint8Array(JSON.parse(document.getElementById('bytes').value));if(bytes[0]!==255||bytes[1]!==216)throw new Error('Se requieren bytes JPEG originales');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));link.download=document.getElementById('filename').value.replace(/[^a-z0-9.-]/gi,'-');link.click();document.getElementById('bytes').value='';document.getElementById('result').textContent='JPEG preparado: '+bytes.length+' bytes';setTimeout(()=>URL.revokeObjectURL(link.href),1000)}catch(error){document.getElementById('result').textContent=error.message}});</script></html>
